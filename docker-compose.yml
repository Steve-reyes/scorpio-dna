services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - APP_PASSWORD=${APP_PASSWORD:-scorpiodna2024}
      - DATABASE_URL=sqlite:///data/scorpio_dna.db
    volumes:
      - dna_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dna_data:
